
<h2>Cadastrar Livro</h2>

<form method="dialog">
    

    <input type="number" placeholder="ISBN">
    
    <input type="text" name="nome" placeholder="Titulo">
    
    <input type="text" name="author" placeholder="Author">

    <input type="text" name="" id="" placeholder="Editora">

    <input type="text" placeholder="Ano de lançamento">
    

    
     
    <div class="btns">
        <button id="btnFechar">Fechar</button>

        <button type="submit" id="btnSavar">Salvar</button>
    </div>
    
</form>
